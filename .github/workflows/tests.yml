name: Saucedemo auto tests

on:
 push:
 workflow_dispatch:

jobs:
 test:
  runs-on: ubuntu-latest

  timeout-minutes: 15

  steps:
   - name: 拉取代码
     uses: actions/checkout@v4

   - name: 配置python
     uses: actions/setup-python@v5
     with:
      python-version: '3.12'
      cache: 'pip'
  
   - name: 安装依赖
     run: pip install -r requirements.txt

   - name: 运行测试
     run: |
       mkdir -p reports
       python -m pytest tests/ --html=reports/report.html --self-contained-html

   - name: 上传测试报告
     if: always()
     uses: actions/upload-artifact@v4
     with:
       name: pytest-report
       path: reports/
       retention-days: 14
       if-no-files-found: ignore